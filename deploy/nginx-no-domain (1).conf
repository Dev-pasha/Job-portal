# Nginx site for the job portal.
# Install to /etc/nginx/sites-available/job-portal, then symlink into sites-enabled.
#
# Replace example.com with your own domain before using this.
# Certbot rewrites this file when you run it, adding the TLS block and the
# redirect from port 80.

# Variant for a server with no domain name yet: reached by its IP address.
#
# The only differences from nginx.conf are server_name and the absence of TLS.
# When you buy a domain, switch to nginx.conf instead and run certbot.
#
# THIS SERVES PLAIN HTTP. Admin sign-ins and uploaded CVs travel unencrypted.
# Use it to get the site running and to test, not to collect real applications.

server {
    listen 80 default_server;
    # Remove the next line if nginx reports
    # "socket() [::]:80 failed (97: Address family not supported by protocol)",
    # which means this machine has no IPv6.
    listen [::]:80 default_server;

    # Matches any hostname, which is what you want when the site is reached by
    # its bare IP address.
    server_name _;

    root /opt/job-portal/client/dist;
    index index.html;

    # CVs are capped at 5 MB by the API. Nginx rejects a request before the API
    # ever sees it, so this must be larger, or uploads fail with a 413 that the
    # application cannot explain to the user.
    client_max_body_size 12M;

    access_log /var/log/nginx/job-portal.access.log;
    error_log  /var/log/nginx/job-portal.error.log;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Ad networks look for this at the domain root.
    location = /ads.txt {
        access_log off;
    }

    # The API. Everything under /api is proxied to the Node service.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Ad banners are public files. Nginx serves them straight from disk rather
    # than waking the Node process for every image.
    #
    # Note that uploaded CVs live in server/data/uploads and are deliberately NOT
    # served here. They are only reachable through an authenticated API route.
    location /ad-images/ {
        alias /opt/job-portal/server/data/ad-images/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Vite writes hashed filenames, so these can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The client is a single-page app: any unmatched path returns index.html and
    # React Router decides what to show. Without this, refreshing /privacy or
    # sharing a link to /jobs/12 would give a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or visitors keep loading an old
    # build that points at asset filenames which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Basic hardening. Content-Security-Policy is deliberately left out: ad
    # network scripts would breach any policy strict enough to be worth setting.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
